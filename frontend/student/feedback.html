<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback & Grievance - Learning Hub</title>


    <!-- GLOBAL THEME -->
    <link rel="stylesheet"
          href="../css/global_theme.css">


    <!-- ICONS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- FEEDBACK PAGE CSS -->
    <link rel="stylesheet"
          href="css/feedback.css">

</head>


<body>


<div class="app-layout">


    <!-- =====================================
         GLOBAL SIDEBAR
         ===================================== -->

    <aside class="sidebar">


        <!-- Learning Hub -->

        <div class="sidebar-brand">

            <div class="sidebar-brand-icon">

                <i class="fas fa-graduation-cap"></i>

            </div>

            Learning Hub

        </div>


        <!-- Navigation -->

        <nav class="sidebar-nav">


            <a href="dashboard.html"
               class="nav-item">

                <i class="fas fa-home"></i>

                <span>Dashboard</span>

            </a>


            <a href="task.html"
               class="nav-item">

                <i class="fas fa-tasks"></i>

                <span>Task</span>

            </a>


            <a href="course.html"
               class="nav-item">

                <i class="fas fa-book"></i>

                <span>Course Selection</span>

            </a>


            <!-- ACTIVE PAGE -->

            <a href="feedback.html"
               class="nav-item active-nav">

                <i class="fas fa-comment-dots"></i>

                <span>Feedback &amp; Grievance</span>

            </a>


            <a href="academic.html"
               class="nav-item">

                <i class="fas fa-graduation-cap"></i>

                <span>Academic</span>

            </a>


            <a href="notification.html"
               class="nav-item">

                <i class="fas fa-bell"></i>

                <span>Notification</span>

            </a>


            <a href="settings.html"
               class="nav-item">

                <i class="fas fa-cog"></i>

                <span>Settings</span>

            </a>


        </nav>


        <!-- Sidebar Logout -->

        <div class="nav-logout">

            <a href="#"
               class="nav-item">

                <i class="fas fa-sign-out-alt"></i>

                <span>Logout</span>

            </a>

        </div>


    </aside>


    <!-- Mobile Overlay -->

    <div class="sidebar-overlay"></div>



    <!-- =====================================
         MAIN CONTENT
         ===================================== -->

    <main class="main-content">


        <!-- =================================
             GLOBAL HEADER
             ================================= -->

        <div class="top-bar">


            <!-- LEFT -->

            <div class="top-bar-left">


                <!-- Hamburger -->

                <button class="menu-toggle"
                        id="menuToggle">

                    <i class="fas fa-bars"></i>

                </button>


                <!-- Greeting -->

                <div class="greeting-block">


                    <!-- Avatar -->

                    <img
                        src="https://ui-avatars.com/api/?name=Emily+Johnson&background=3b82f6&color=fff"
                        alt=""
                        class="greeting-avatar"
                    >


                    <div>

                        <h1 class="greeting-title">
                            Good morning, Emily
                        </h1>


                        <p class="greeting-date">
                            Tuesday, December 30
                        </p>

                    </div>


                </div>


            </div>


            <!-- =================================
                 RIGHT USER PROFILE
                 ================================= -->

            <div class="user-pill">


                <div class="user-pill-info">

                    <p class="user-pill-name">
                        Emily Johnson
                    </p>


                    <span class="user-pill-role">
                        STUDENT
                    </span>

                </div>


                <!-- Logout -->

                <a href="../login.html"
                   class="logout-btn"
                   aria-label="Log out">

                    <i class="fas fa-sign-out-alt"></i>

                </a>


            </div>


        </div>



        <!-- =====================================
             FEEDBACK CONTENT
             ===================================== -->

       <!-- Feedback & Grievance Panel -->
<div class="feedback-panel">

    <h2 class="feedback-page-title">
        Feedback & Grievance
    </h2>

    <p class="feedback-description">
        Submit your feedback or report any academic concerns below.
    </p>


    <div class="feedback-grid">


        <!-- Feedback Type -->
        <div class="feedback-field">

            <label class="feedback-label">
                Feedback &amp; Grievance Type
            </label>

            <select class="feedback-select">

                <option>
                    Select category...
                </option>

                <option>
                    Feedback
                </option>

                <option>
                    Grievance
                </option>

                <option>
                    Suggestion
                </option>

            </select>

        </div>


        <!-- Course -->
        <div class="feedback-field">

            <label class="feedback-label">
                Course
            </label>

            <select class="feedback-select">

                <option>
                    Choose the course...
                </option>

                <option>
                    CS301 - Data Structures
                </option>

                <option>
                    CS302 - Web Technologies
                </option>

                <option>
                    CS305 - Software Engineering
                </option>

            </select>

        </div>


        <!-- Faculty -->
        <div class="feedback-field">

            <label class="feedback-label">
                Faculty
            </label>

            <select class="feedback-select">

                <option>
                    Choose the faculty...
                </option>

                <option>
                    Dr. Asha Menon
                </option>

                <option>
                    Prof. Ravi Kumar
                </option>

                <option>
                    Ms. Neha Thomas
                </option>

            </select>

        </div>


        <!-- Report Details -->
        <div class="feedback-field">

            <label class="feedback-label">
                Report Details
            </label>

            <textarea
                class="feedback-textarea"
                rows="5"
                placeholder="Describe your feedback or grievance in detail..."
            ></textarea>

        </div>


    </div>


    <!-- Submit -->
    <div class="feedback-actions">

        <button
            type="button"
            class="feedback-submit-btn">

            <i class="fas fa-paper-plane"></i>

            Submit Report

        </button>

    </div>

</div>


        </div>


    </main>


</div>



<!-- GLOBAL JAVASCRIPT -->

<script src="../js/global.js"></script>


</body>

</html>
