<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedback & Grievance - Learning Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/frontend/student/css/feedback.css"/>
</head>
<body class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="sidebar w-56 text-slate-300 flex flex-col p-3 space-y-3">
    <div class="px-3 py-3 text-lg font-bold text-white flex items-center gap-2">
      <div class="w-6 h-6 bg-white/20 rounded-md"></div>
      Learning Hub
    </div>
    <nav class="flex-1 space-y-1">
      <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="internal.html" class="nav-item"><i class="fa-solid fa-list-check"></i> Task</a>
      <a href="course.html" class="nav-item"><i class="fa-solid fa-book"></i> Course Selection</a>
      <a href="feedback.html" class="nav-item active-nav"><i class="fa-solid fa-comment-dots"></i> Feedback & Grievance</a>
      <a href="attendance.html" class="nav-item"><i class="fa-solid fa-graduation-cap"></i> Academic</a>
      <a href="notification.html" class="nav-item"><i class="fa-solid fa-bell"></i> Notification</a>
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <a href="#" class="nav-item border-t border-slate-700 pt-3"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-4 overflow-hidden">
    <!-- Header -->
    <header class="flex justify-between items-center mb-4">
      <div class="flex items-center gap-3">
        <img src="https://ui-avatars.com/api/?name=Emily+Johnson&background=random" class="w-10 h-10 rounded-full border-2 border-white shadow-sm"/>
        <div>
          <h1 class="text-lg font-bold text-slate-800">Good Morning, Emily Johnson</h1>
          <p class="text-xs text-slate-500">Tuesday, December 30</p>
        </div>
      </div>
    </header>

    <!-- Feedback Form -->
    <div class="bg-white rounded-2xl p-5 card-shadow h-[calc(100vh-7rem)] overflow-y-auto">
      <h2 class="section-title mb-4">Feedback & Grievance</h2>
      <p class="text-sm text-slate-600 mb-6">Submit your feedback or report any academic concerns below.</p>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Feedback & Grievance Type</label>
          <select class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option>Select category...</option>
            <option>Feedback</option>
            <option>Grievance</option>
            <option>Suggestion</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Course</label>
          <select class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option>Choose the course...</option>
            <option>CS301 - Data Structures</option>
            <option>CS302 - Web Technologies</option>
            <option>CS305 - Software Engineering</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Faculty</label>
          <select class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option>Choose the faculty...</option>
            <option>Dr. Asha Menon</option>
            <option>Prof. Ravi Kumar</option>
            <option>Ms. Neha Thomas</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Report Details</label>
          <textarea rows="5" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Describe your feedback or grievance in detail..."></textarea>
        </div>
      </div>

      <div class="text-right">
        <button class="px-5 py-2 bg-blue-500 text-white text-sm font-semibold rounded-lg hover:bg-blue-600 transition">Submit Report</button>
      </div>
    </div>
  </main>
</body>
</html>
