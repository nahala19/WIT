<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Learning Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../../student/css/dashboard.css" />
  <link rel="stylesheet" href="css/faculty.css" />
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>
    <aside id="sidebar" class="sidebar" aria-label="Faculty navigation">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
        <span>Learning Hub</span>
      </div>
      <nav class="sidebar-nav">
        <span class="nav-group-label">Teaching</span>
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a href="classes.html" class="nav-item"><i class="fa-solid fa-users-rectangle"></i> My Classes</a>
        <a href="attendance/index.html" class="nav-item"><i class="fa-solid fa-clipboard-check"></i> Attendance</a>
        <a href="marks.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i> Marks</a>
        <a href="assignments/index.html" class="nav-item"><i class="fa-solid fa-file-lines"></i> Assignments</a>
        <a href="materials.html" class="nav-item"><i class="fa-solid fa-folder-open"></i> Materials</a>
        <a href="timetable.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i> Timetable</a>
        <span class="nav-group-label">Communication</span>
        <a href="feedback.html" class="nav-item"><i class="fa-solid fa-comment-dots"></i> Feedback</a>
        <a href="notifications/index.html" class="nav-item"><i class="fa-solid fa-bell"></i> Notifications</a>
        <span class="nav-group-label">Insights</span>
        <a href="reports.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Reports</a>
        <span class="nav-group-label nav-hod-only">Department</span>
        <a href="department/overview.html" class="nav-item nav-hod-only"><i class="fa-solid fa-building-columns"></i> Overview</a>
        <a href="department/faculty.html" class="nav-item nav-hod-only"><i class="fa-solid fa-user-tie"></i> Faculty</a>
        <a href="department/allocations.html" class="nav-item nav-hod-only"><i class="fa-solid fa-table-list"></i> Allocations</a>
        <a href="department/approvals.html" class="nav-item nav-hod-only"><i class="fa-solid fa-circle-check"></i> Approvals</a>
        <a href="settings.html" class="nav-item active-nav"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>
      <a href="../../login.html" class="nav-item nav-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Open menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
          <div class="greeting-block">
            <img src="https://ui-avatars.com/api/?name=Asha+Menon&background=3b82f6&color=fff" alt="" class="greeting-avatar" />
            <div>
              <h1 class="greeting-title">Settings</h1>
              <p class="greeting-date">Faculty profile & preferences</p>
            </div>
          </div>
        </div>
        <div class="user-pill">
          <div class="user-pill-info">
            <p class="user-pill-name" id="user-display-name">Dr. Asha Menon</p>
            <span class="user-pill-role" id="user-role-badge">Teacher</span>
          </div>
          <a href="../../login.html" class="logout-btn" aria-label="Log out"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
        </div>
      </header>

      <div class="dashboard-panel">
        <section>
          <div class="section-header">
            <h2 class="section-title">Profile</h2>
          </div>
          <form class="two-col-form" style="max-width:48rem;">
            <div class="form-group">
              <label class="form-label" for="full-name">Full name</label>
              <input type="text" id="full-name" class="form-input" value="Dr. Asha Menon" />
            </div>
            <div class="form-group">
              <label class="form-label" for="employee-id">Employee ID</label>
              <input type="text" id="employee-id" class="form-input" value="FAC-CSE-0142" readonly />
            </div>
            <div class="form-group">
              <label class="form-label" for="email">Email</label>
              <input type="email" id="email" class="form-input" value="asha.menon@wit.edu" />
            </div>
            <div class="form-group">
              <label class="form-label" for="phone">Phone</label>
              <input type="tel" id="phone" class="form-input" value="+91 98765 43210" />
            </div>
            <div class="form-group">
              <label class="form-label" for="department">Department</label>
              <input type="text" id="department" class="form-input" value="Computer Science & Engineering" readonly />
            </div>
            <div class="form-group">
              <label class="form-label" for="designation">Designation</label>
              <select id="designation" class="form-select">
                <option>Assistant Professor</option>
                <option selected>Associate Professor</option>
                <option>Professor</option>
                <option>HOD</option>
              </select>
            </div>
            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label" for="bio">Bio / office hours</label>
              <textarea id="bio" class="form-textarea" rows="4">Office: Room 204, Block B. Hours: Mon–Thu 2:00–4:00 PM. Research: distributed systems, databases.</textarea>
            </div>
            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label" for="notify-pref">Email notifications</label>
              <select id="notify-pref" class="form-select">
                <option>All assignment submissions</option>
                <option selected>Daily digest only</option>
                <option>None</option>
              </select>
            </div>
            <div style="grid-column:1/-1;display:flex;gap:0.5rem;">
              <button type="submit" class="btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save changes</button>
              <button type="button" class="btn-secondary">Change password</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="js/session.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
